name: Share a case study
description: Tell us how a skill worked on your real game
title: "[case study] <game name>"
labels: [case-study]
body:
  - type: input
    id: game
    attributes:
      label: Game and link
    validations:
      required: true
  - type: input
    id: skills
    attributes:
      label: Skills used
  - type: textarea
    id: results
    attributes:
      label: What you did and the numbers (views, plays, wishlists…)
      description: Bad numbers are welcome. They teach the most.
    validations:
      required: true
