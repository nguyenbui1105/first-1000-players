name: Skill idea or bug
description: Suggest a new skill or report a skill giving bad advice
labels: [skill]
body:
  - type: input
    id: skill
    attributes:
      label: Skill (existing or proposed)
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What should it do, or what went wrong? Include the prompt you used if possible.
    validations:
      required: true
