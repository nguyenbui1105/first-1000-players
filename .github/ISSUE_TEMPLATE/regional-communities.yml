name: Add communities for my region
description: Share where game devs and players gather in your country or language
title: "[region] <country or language>"
labels: [regional]
body:
  - type: input
    id: region
    attributes:
      label: Country or language
    validations:
      required: true
  - type: textarea
    id: communities
    attributes:
      label: Communities, events or festivals
      description: For each one, add the link, approximate size, what kind of game posts fit, and the self-promotion rules you checked (with date).
    validations:
      required: true
  - type: textarea
    id: rules
    attributes:
      label: Local publishing rules (optional)
      description: e.g. game licensing or age-rating requirements, with a source link.
